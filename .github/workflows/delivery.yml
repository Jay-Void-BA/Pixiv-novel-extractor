name: Build, test & release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: delivery-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  FLUTTER_VERSION: '3.47.9'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  DASH__SUPPRESS_ANALYTICS: 'true'

jobs:
  verify:
    name: Tests & Web bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --fatal-infos
      - run: flutter test --coverage --reporter expanded
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: python3 tool/verify_pdf.py
      - run: python3 -m unittest discover -s test -p 'test_*.py' -v
      - run: node --test test/extension_test.cjs
      - run: flutter build web --release --no-pub --no-web-resources-cdn --no-wasm-dry-run
      - run: python3 -m pip install playwright==1.56.0
      - run: python3 -m playwright install --with-deps chromium
      - run: python3 tool/browser_smoke.py
      - run: python3 tool/package_web.py
      - run: python3 tool/package_extension.py
      - uses: actions/upload-artifact@v4
        with:
          name: web-and-bridge
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: test-coverage-and-pdf
          path: |
            coverage/lcov.info
            build/test-exports/cjk-long.pdf
            build/browser-results/*
          if-no-files-found: error

  freebsd:
    name: FreeBSD local server
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-and-bridge
          path: dist
      - uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: pkg install -y python311 ca_root_nss
          run: |
            python3.11 -m unittest discover -s test -p 'test_*.py' -v
            python3.11 -c "import zipfile; z=zipfile.ZipFile('dist/shiori-web-freebsd.zip'); assert z.testzip() is None; assert 'web/index.html' in z.namelist(); assert 'shiori_server.py' in z.namelist()"

  linux:
    name: Linux x64
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev xvfb xauth scrot xdotool gsettings-desktop-schemas
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build linux --release --no-pub
      - run: bash tool/native_linux_smoke.sh
      - run: cp LICENSE build/linux/x64/release/bundle/LICENSE && cp docs/LINUX.md build/linux/x64/release/bundle/README.md && mkdir -p dist && tar -czf dist/shiori-linux-x64.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: linux-native-validation
          path: build/native-validation/*
          if-no-files-found: error

  windows:
    name: Windows x64
    needs: verify
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build windows --release --no-pub
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/shiori-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  apple:
    name: macOS & iOS unsigned
    needs: verify
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build macos --release --no-pub
      - run: flutter build ios --release --no-codesign --no-pub
      - shell: bash
        run: |
          mkdir -p dist
          app=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)
          test -n "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" "dist/shiori-macos-$(uname -m).zip"
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app dist/shiori-ios-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: apple
          path: dist/*
          if-no-files-found: error

  android:
    name: Android release APK
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SHIORI_KEYSTORE_PASSWORD: ${{ secrets.SHIORI_KEYSTORE_PASSWORD }}
      SHIORI_KEYSTORE_BASE64: ${{ secrets.SHIORI_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Restore release signing key
        shell: python
        run: |
          import base64, os
          from pathlib import Path
          key = os.environ.get('SHIORI_KEYSTORE_BASE64')
          password = os.environ.get('SHIORI_KEYSTORE_PASSWORD')
          if key and password:
              path = Path(os.environ['RUNNER_TEMP']) / 'shiori-release.jks'
              path.write_bytes(base64.b64decode(key, validate=True))
              with open(os.environ['GITHUB_ENV'], 'a') as out:
                  out.write(f'SHIORI_KEYSTORE_PATH={path}\n')
          elif os.environ['GITHUB_REF'].startswith('refs/tags/'):
              raise SystemExit('Release tags require SHIORI_KEYSTORE_BASE64 and SHIORI_KEYSTORE_PASSWORD secrets.')
          else:
              print('Development build: no release signing key configured.')
      - run: flutter build apk --release --no-pub
      - run: python3 tool/verify_android.py
      - run: mkdir -p dist && cp build/app/outputs/flutter-apk/app-release.apk dist/shiori-android.apk
      - name: Remove restored key
        if: always()
        run: rm -f "$RUNNER_TEMP/shiori-release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish complete release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, freebsd, linux, windows, apple, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: downloaded
      - shell: bash
        run: |
          mkdir -p dist
          find downloaded -name 'shiori-*' -type f -exec cp {} dist/ \;
          python3 tool/check_release.py dist
      - name: Publish assets and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Shiori $GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md --verify-tag
