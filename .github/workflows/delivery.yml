name: Build, test & release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      verify_android_signing:
        description: 'Build and verify the official Android signature without publishing (select main)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: delivery-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  FLUTTER_VERSION: '3.47.9'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  DASH__SUPPRESS_ANALYTICS: 'true'

jobs:
  verify:
    name: Tests & Web bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: flutter pub get
      - run: dart format lib test integration_test tool/benchmark_client.dart
      - run: |
          mkdir -p build
          git diff -- lib test integration_test tool/benchmark_client.dart pubspec.lock linux/flutter windows/flutter macos/Flutter/GeneratedPluginRegistrant.swift > build/format.patch
      - run: flutter analyze --fatal-infos
      - run: flutter test --coverage --reporter expanded
      - run: dart run tool/benchmark_client.dart
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: python3 tool/verify_pdf.py
      - run: python3 -m unittest discover -s test -p 'test_*.py' -v
      - run: node --test test/extension_test.cjs
      - run: flutter build web --release --no-pub --no-web-resources-cdn --no-wasm-dry-run
      - run: python3 -m pip install playwright==1.62.0
      - run: python3 -m playwright install --with-deps chromium
      - run: python3 tool/browser_smoke.py
      - run: python3 tool/package_web.py
      - run: python3 tool/package_extension.py
      - uses: actions/upload-artifact@v4
        with:
          name: web-and-bridge
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-coverage-and-pdf
          path: |
            coverage/lcov.info
            build/test-exports/cjk-long.pdf
            build/browser-results/*
            build/benchmark-client.json
            build/format.patch
          if-no-files-found: error

  freebsd:
    name: FreeBSD local server
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-and-bridge
          path: dist
      - uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: pkg install -y python311 ca_root_nss
          run: |
            python3.11 -m unittest discover -s test -p 'test_*.py' -v
            python3.11 -c "import zipfile; z=zipfile.ZipFile('dist/shiori-web-freebsd.zip'); assert z.testzip() is None; assert 'web/index.html' in z.namelist(); assert 'shiori_server.py' in z.namelist()"

  linux:
    name: Linux x64
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libsecret-tools gnome-keyring dbus-x11 xvfb xauth scrot xdotool gsettings-desktop-schemas
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release --no-pub
      - run: bash tool/native_linux_smoke.sh
      - name: Test real Linux and local-Web system keyrings
        shell: bash
        run: |
          xvfb-run -a dbus-run-session -- bash -euo pipefail -c '
            export SHIORI_ISOLATED_TEST_KEYRING=true
            export XDG_DATA_HOME=$(mktemp -d)
            export LIBGL_ALWAYS_SOFTWARE=1 GDK_BACKEND=x11
            python3 tool/start_test_keyring.py
            flutter test integration_test/session_storage_test.dart -d linux --reporter expanded
            python3 tool/verify_system_vault.py
          '
      - run: cp LICENSE build/linux/x64/release/bundle/LICENSE && cp docs/LINUX.md build/linux/x64/release/bundle/README.md && mkdir -p dist && tar -czf dist/shiori-linux-x64.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: linux-native-validation
          path: build/native-validation/*
          if-no-files-found: error

  windows:
    name: Windows x64
    needs: verify
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release --no-pub
      - run: flutter test integration_test/session_storage_test.dart -d windows --reporter expanded
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/shiori-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  apple:
    name: macOS & iOS unsigned
    needs: verify
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release --no-pub
      - run: flutter build ios --release --no-codesign --no-pub
      - run: flutter test integration_test/session_storage_test.dart -d macos --reporter expanded
      - name: Test the real iOS Keychain on a simulator
        shell: bash
        run: |
          shiori_simulator=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for group in json.load(sys.stdin)["devices"].values() for d in group if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$shiori_simulator" || true
          xcrun simctl bootstatus "$shiori_simulator" -b
          flutter test integration_test/session_storage_test.dart -d "$shiori_simulator" --reporter expanded
      - shell: bash
        run: |
          mkdir -p dist
          app=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)
          test -n "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" "dist/shiori-macos-$(uname -m).zip"
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app dist/shiori-ios-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: apple
          path: dist/*
          if-no-files-found: error

  android:
    name: Android build & signing checks
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Select Android build mode
        id: android_mode
        env:
          SHIORI_VERIFY_SIGNING: ${{ inputs.verify_android_signing }}
        shell: python
        run: |
          import os
          ref = os.environ['GITHUB_REF']
          manual = os.environ.get('SHIORI_VERIFY_SIGNING', '').lower() == 'true'
          if manual and ref != 'refs/heads/main' and not ref.startswith('refs/tags/v'):
              raise SystemExit('Select main for manual release-signing verification.')
          mode = 'release' if ref.startswith('refs/tags/v') or manual else 'development'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'mode={mode}\n')
      - name: Restore and validate the official release key
        if: steps.android_mode.outputs.mode == 'release'
        env:
          SHIORI_KEYSTORE_BASE64: ${{ secrets.SHIORI_KEYSTORE_BASE64 }}
          SHIORI_KEYSTORE_PASSWORD: ${{ secrets.SHIORI_KEYSTORE_PASSWORD }}
          SHIORI_KEY_ALIAS: ${{ secrets.SHIORI_KEY_ALIAS }}
          SHIORI_KEY_PASSWORD: ${{ secrets.SHIORI_KEY_PASSWORD }}
          SHIORI_SIGNING_CERT_SHA256: ${{ secrets.SHIORI_SIGNING_CERT_SHA256 }}
        run: python3 tool/prepare_android_signing.py
      - name: Build official release APK
        if: steps.android_mode.outputs.mode == 'release'
        env:
          SHIORI_KEYSTORE_PASSWORD: ${{ secrets.SHIORI_KEYSTORE_PASSWORD }}
          SHIORI_KEY_ALIAS: ${{ secrets.SHIORI_KEY_ALIAS }}
          SHIORI_KEY_PASSWORD: ${{ secrets.SHIORI_KEY_PASSWORD }}
        run: flutter build apk --release --no-pub
      - name: Verify official APK and certificate pin
        if: steps.android_mode.outputs.mode == 'release'
        env:
          SHIORI_SIGNING_CERT_SHA256: ${{ secrets.SHIORI_SIGNING_CERT_SHA256 }}
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/shiori-android.apk
          python3 tool/verify_android.py dist/shiori-android.apk --report dist/android-signing-verification.json
      - name: Build development APK without release credentials
        if: steps.android_mode.outputs.mode == 'development'
        run: flutter build apk --debug --no-pub
      - name: Verify development APK
        if: steps.android_mode.outputs.mode == 'development'
        run: |
          python3 tool/verify_android.py build/app/outputs/flutter-apk/app-debug.apk --mode development --report build/android-development-verification.json
          mkdir -p development
          cp build/app/outputs/flutter-apk/app-debug.apk development/shiori-android-debug.apk
      - name: Confirm the release gate rejects the actual development APK
        if: steps.android_mode.outputs.mode == 'development'
        shell: python
        run: |
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'tool')
          from android_signing import SigningError
          from verify_android import verify
          report = json.loads(Path('build/android-development-verification.json').read_text())
          try:
              verify(Path('build/app/outputs/flutter-apk/app-debug.apk').resolve(), release=True,
                     expected=report['certificate_sha256'])
          except SigningError as error:
              if 'Debug certificates and debuggable APKs' not in str(error):
                  raise SystemExit('The development APK must fail the release identity check.') from None
          else:
              raise SystemExit('Release gate incorrectly accepted a development APK.')
          print('PASS: the actual development APK is rejected even when its certificate fingerprint matches.')
      - name: Remove restored key
        if: always()
        run: rm -rf "$RUNNER_TEMP/shiori-android-signing"
      - uses: actions/upload-artifact@v4
        if: success() && steps.android_mode.outputs.mode == 'release'
        with:
          name: android-release
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: success() && steps.android_mode.outputs.mode == 'development'
        with:
          name: android-development
          path: development/shiori-android-debug.apk
          if-no-files-found: error

  android-vault:
    name: Android Keystore security tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug --no-pub
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: cd android && ./gradlew connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-keystore-tests
          path: |
            build/app/reports/androidTests/**
            build/app/outputs/androidTest-results/**
          if-no-files-found: warn

  release:
    name: Publish complete release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, freebsd, linux, windows, apple, android, android-vault]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          pattern: '{web-and-bridge,linux,windows,apple,android-release}'
          merge-multiple: true
          path: dist
      - name: Verify the final official APK before publication
        env:
          SHIORI_SIGNING_CERT_SHA256: ${{ secrets.SHIORI_SIGNING_CERT_SHA256 }}
        run: |
          python3 tool/verify_android.py dist/shiori-android.apk --report dist/android-signing-verification.json
          python3 tool/check_release.py dist
      - name: Publish assets and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shiori_draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [ "$shiori_draft" = true ]; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest --title "Shiori $GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md
          elif [ "$shiori_draft" = false ]; then
            echo "Release already published; refusing to replace public assets."
            exit 1
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "Shiori $GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md --verify-tag
          fi
